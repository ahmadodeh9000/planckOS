set timeout=0

# Load every video driver so GRUB can find a graphics mode.
insmod all_video

menuentry "planckOS" {
    multiboot /boot/kernel
    # Must come after 'multiboot', which sets gfxpayload from the kernel's
    # own video request. Use gfxpayload=text to boot the text-mode shell.
    set gfxpayload=1024x768x32
    boot
}
